<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Shadow Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .lab { grid-template-columns: auto minmax(0, 1fr); }
  .phonebox { position: relative; height: min(80vh, 860px); aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #fff; container-type: inline-size; }
  .phonebox .bright { position: absolute; left: 0; top: 0; width: 100%; height: 50%; object-fit: cover; object-position: top; }
  .phonebox video { position: absolute; left: 0; top: 50%; width: 100%; height: 50%; object-fit: cover; object-position: 50% 30%; }
  .cap { position: absolute; left: 0; right: 0; transform: translateY(-50%); text-align: center; color: #fff; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; font-family: var(--font); }
  .cap.top { top: calc(620 / 1920 * 100%); } .cap.bottom { top: calc(1240 / 1920 * 100%); }
  .side { display: grid; gap: 18px; }
  @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } .phonebox { height: auto; width: 100%; } }
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>Shadow Lab</h1><a class="back" href="/">← Style Studio</a></div></header>
<div class="lab">
  <div class="phonebox">
    <img class="bright" src="assets/bright.png" alt="">
    <video src="assets/face-loop.mp4" muted loop autoplay playsinline></video>
    <div class="cap top" id="capTop"></div><div class="cap bottom" id="capBottom"></div>
  </div>
  <div class="side">
    <div class="panel">
      <div class="row"><label>Words</label><input type="text" id="text"></div>
      <div class="row"><label>Text size <span id="v-size"></span></label><input type="range" id="size" min="56" max="120"></div>
      <div class="row"><label>Shadow colour</label><div class="toggle" id="colour"></div></div>
    </div>
    <div class="panel">
      <h3>Soft spread</h3>
      <div class="row"><label>Softness <span id="v-blur"></span></label><input type="range" id="blur" min="0" max="60"></div>
      <div class="row"><label>Strength <span id="v-alpha"></span></label><input type="range" id="alpha" min="0" max="100"></div>
      <div class="row"><label>Drop <span id="v-y"></span></label><input type="range" id="y" min="0" max="20"></div>
    </div>
    <div class="panel">
      <h3>Crisp edge</h3>
      <div class="row"><label>Strength <span id="v-edge"></span></label><input type="range" id="edge" min="0" max="100"></div>
      <div class="row"><label>Softness <span id="v-edgeBlur"></span></label><input type="range" id="edgeBlur" min="0" max="8"></div>
      <div class="mono" id="css"></div>
      <div class="lockbar"><button class="ghost" id="reset">Reset</button><button class="submit" id="lock">Lock this shadow</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="boot.js"></script>
<script>
(async () => {
const { brand, shadow: locked } = await window.boot;
const $ = id => document.getElementById(id), hexRgb = h => { const n = parseInt(h.slice(1), 16); return `${n >> 16},${(n >> 8) & 255},${n & 255}`; };
const COLS = { Black: "0,0,0", "Your ink": hexRgb(brand.colours.ink) };
$("colour").innerHTML = Object.entries(COLS).map(([n, v]) => `<button data-v="${v}">${n}</button>`).join("");
// Starts from "soft and wide": 0 4px 24px rgba(0,0,0,.5)
const DEFAULTS = { text: ((brand.lines && brand.lines.talk) || ["most people", "get this", "completely wrong"])[2], size: 84, rgb: "0,0,0", blur: 24, alpha: 50, y: 4, edge: 0, edgeBlur: 2 };
const KEY = "style-shadow";
let st = { ...DEFAULTS, ...(locked || {}) };
try { st = { ...st, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
const css = () => [...(st.edge > 0 ? [`0 1px ${st.edgeBlur}px rgba(${st.rgb},${(st.edge / 100).toFixed(2)})`] : []), `0 ${st.y}px ${st.blur}px rgba(${st.rgb},${(st.alpha / 100).toFixed(2)})`].join(", ");
const scaled = s => s.replace(/(\d+(?:\.\d+)?)px/g, (_, n) => `calc(${n} / 1080 * 100cqw)`);   // frame px -> preview box
function apply() {
  for (const k of ["size", "blur", "alpha", "y", "edge", "edgeBlur"]) $(k).value = st[k];
  $("text").value = st.text;
  $("v-size").textContent = st.size + "px"; $("v-blur").textContent = st.blur + "px"; $("v-alpha").textContent = st.alpha + "%";
  $("v-y").textContent = st.y + "px"; $("v-edge").textContent = st.edge ? st.edge + "%" : "off"; $("v-edgeBlur").textContent = st.edgeBlur + "px";
  $("colour").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === st.rgb));
  $("css").textContent = "text-shadow: " + css();
  for (const el of [$("capTop"), $("capBottom")]) { el.textContent = st.text || " "; el.style.fontSize = `calc(${st.size} / 1080 * 100cqw)`; el.style.textShadow = scaled(css()); }
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
}
for (const k of ["size", "blur", "alpha", "y", "edge", "edgeBlur"]) $(k).addEventListener("input", e => { st[k] = +e.target.value; apply(); });
$("text").addEventListener("input", e => { st.text = e.target.value; apply(); });
$("colour").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st.rgb = b.dataset.v; apply(); }));
$("reset").addEventListener("click", () => { st = { ...DEFAULTS }; apply(); });
$("lock").addEventListener("click", async () => {
  const { text, ...rest } = st;
  try {
    const r = await fetch("/api/lock/shadow", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...rest, text_shadow: css(), frame_width: 1080 }) });
    if (!r.ok) throw new Error(r.status);
    toast("Shadow locked.");
  } catch { toast("Couldn't save. Ask Claude to restart the page."); }
});
apply();
window.pageReady = true;
})();
</script>
</body>
</html>
