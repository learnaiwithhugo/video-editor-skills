<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Text Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .lab { grid-template-columns: auto minmax(0, 1fr); }
  .phonebox { position: sticky; top: 78px; height: min(82vh, 860px); aspect-ratio: 9 / 16; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--paper); container-type: inline-size; }
  .phonebox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .title { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font); line-height: .95; }
  .title span { display: inline-block; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; padding-bottom: .06em; white-space: nowrap; }
  .side { display: grid; gap: 18px; max-width: 560px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lockbar { flex-wrap: wrap; }
  .lockbar button { flex: 1 1 auto; white-space: nowrap; }
  @media (max-width: 900px) {
    .lab { grid-template-columns: 1fr; }
    .phonebox { position: relative; top: auto; height: auto; width: min(100%, 440px, calc(62vh * 9 / 16)); margin: 0 auto; }
    .side { max-width: none; }
  }
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>Text Lab</h1><a class="back" href="/">← Style Studio</a></div></header>
<div class="lab">
  <div class="phonebox" id="phone">
    <video id="vid" muted loop playsinline hidden></video>
    <div class="title" id="title"></div>
  </div>
  <div class="side">
    <div class="panel">
      <h3>Words</h3>
      <div class="pair">
        <div class="row"><label for="l1">Line 1</label><input type="text" id="l1"></div>
        <div class="row"><label for="l2">Line 2</label><input type="text" id="l2"></div>
      </div>
      <div class="row"><label>Background</label><div class="toggle" id="bg"></div></div>
    </div>
    <div class="panel">
      <h3>Fade</h3>
      <div class="row"><label>Top colour</label><div class="swatches" id="from"></div></div>
      <div class="row"><label>Fades into</label><div class="toggle" id="to"></div></div>
      <div class="row"><label for="start">Fade starts <span id="v-start"></span></label><input type="range" id="start" min="0" max="90"></div>
      <div class="row"><label for="end">How faded at the bottom <span id="v-end"></span></label><input type="range" id="end" min="0" max="100"></div>
      <div class="row"><label>Only fade line 2</label><div class="toggle" id="only"></div></div>
    </div>
    <div class="panel">
      <h3>Look</h3>
      <div class="row"><label for="size">Size <span id="v-size"></span></label><input type="range" id="size" min="70" max="280"></div>
      <div class="row"><label for="top">Height on screen <span id="v-top"></span></label><input type="range" id="top" min="100" max="1500"></div>
      <div class="row"><label>Weight</label><div class="toggle" id="weight"></div></div>
      <div class="row"><label for="track">Letter spacing <span id="v-track"></span></label><input type="range" id="track" min="-70" max="0"></div>
      <div class="row"><label>Soft shadow</label><div class="toggle" id="shadow"></div></div>
      <div class="lockbar"><button class="ghost" id="replay">Replay</button><button class="ghost" id="reset">Reset</button><button class="submit" id="lock">Lock this text</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="boot.js"></script>
<script>
(async () => {
const { brand } = await window.boot;
const $ = id => document.getElementById(id), c = brand.colours;
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const BG = { paper: c.paper || "#FFFFFF", accent: c.accent };                                   // plain colours the preview can sit on
const CHOICES = {
  bg: [["paper", "Paper"], ["accent", "Accent"], ["face", "Your face"]],
  to: [["bg", "Background"], ["clear", "See-through"], ["white", "White"], ["accent", "Accent"], ["soft", "Soft"]],
  only: [["no", "No"], ["yes", "Yes"]],
  weight: [["600", "Semibold"], ["700", "Bold"]],
  shadow: [["off", "Off"], ["on", "On"]],
};
const FROM = [["Ink", c.ink], ["Deep", c.accent_deep], ["Accent", c.accent], ["White", "#FFFFFF"]];
const L = brand.lines || {};
const words = Array.isArray(L.title) && L.title.length >= 2 ? [L.title[0], L.title[1]]            // their own words if they have them
  : Array.isArray(L.intro) && L.intro.length >= 3 ? [L.intro[1], L.intro[2]] : ["Content", "Architecture"];
const DEFAULTS = { l1: words[0], l2: words[1], bg: "paper", from: c.ink, to: "bg", start: 52, end: 100, only: "no", size: 140, top: 720, weight: "700", track: -45, shadow: "off" };
const KEY = "style-text-fade:" + (brand.name || "") + (c.accent || "");   // per brand, so a second style folder on this port doesn't inherit it
const lockedFile = await fetch("/locked/text_fade.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
const locked = {};
if (lockedFile) { for (const k of Object.keys(DEFAULTS)) if (lockedFile[k] !== undefined) locked[k] = lockedFile[k]; if (Array.isArray(lockedFile.sample)) [locked.l1, locked.l2] = lockedFile.sample; }
let st = { ...DEFAULTS, ...locked };
try { st = { ...st, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
if (!(st.bg in BG) && st.bg !== "face") st.bg = "paper";
if (!CHOICES.to.some(([v]) => v === st.to)) st.to = "bg";

for (const id of Object.keys(CHOICES)) {
  $(id).innerHTML = CHOICES[id].map(([v, n]) => `<button data-v="${v}" aria-pressed="false">${n}</button>`).join("");
  $(id).querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st[id] = b.dataset.v; apply(); }));
}
$("from").innerHTML = FROM.map(([n, h]) => `<button title="${n}" aria-label="${n}" data-hex="${h}" style="background:${h}"></button>`).join("");
$("from").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st.from = b.dataset.hex; apply(); }));
for (const id of ["start", "end", "size", "top", "track"]) $(id).addEventListener("input", e => { st[id] = +e.target.value; apply(false); });
for (const id of ["l1", "l2"]) $(id).addEventListener("input", e => { st[id] = e.target.value; apply(false); });

// The fade: the top colour stays solid down to "fade starts", then eases into the colour it fades into.
// "How faded at the bottom" is how far along that journey the last pixel gets (100 = fully there).
function target() {
  if (st.to === "white") return [255, 255, 255, 1];
  if (st.to === "accent") return [...hex(c.accent), 1];
  if (st.to === "soft") return [...hex(c.accent_soft), 1];
  if (st.to === "clear" || (st.to === "bg" && st.bg === "face")) return [...hex(st.from), 0];   // over their face, "background" means see-through
  return [...hex(BG[st.bg]), 1];
}
function bottom() {   // the colour at the very bottom of each line, plain rgba so it works anywhere
  const p = st.end / 100, [tr, tg, tb, ta] = target(), [fr, fg, fb] = hex(st.from), a = p * ta + (1 - p);
  if (a <= 0) return `rgba(${fr},${fg},${fb},0)`;
  const m = (t, f) => Math.round((p * ta * t + (1 - p) * f) / a);
  return `rgba(${m(tr, fr)},${m(tg, fg)},${m(tb, fb)},${+a.toFixed(3)})`;
}
const gradient = () => `linear-gradient(180deg, ${st.from} 0%, ${st.from} ${st.start}%, ${bottom()} 100%)`;
const px = n => `calc(${n} / 1080 * 100cqw)`;   // frame pixels -> the preview box

function apply(replay = true) {
  const face = st.bg === "face", vid = $("vid");
  vid.hidden = !face;
  if (face) { if (!vid.getAttribute("src")) vid.src = "assets/face-loop.mp4"; vid.play().catch(() => {}); } else vid.pause();
  $("phone").style.background = face ? "#000" : BG[st.bg];
  Object.assign($("title").style, {
    top: `calc(${st.top} / 1920 * 100%)`, fontSize: px(st.size), fontWeight: st.weight, letterSpacing: st.track / 1000 + "em",
    filter: st.shadow === "on" ? `drop-shadow(0 ${px(8)} ${px(13)} rgba(0,0,0,.44))` : "none",
  });
  $("title").innerHTML = "";
  [st.l1, st.l2].filter(Boolean).forEach((txt, i) => {
    const line = document.createElement("div"), sp = document.createElement("span");
    sp.textContent = txt;
    sp.style.backgroundImage = st.only === "no" || i === 1 || !st.l1 ? gradient() : `linear-gradient(${st.from}, ${st.from})`;   // "only line 2" leaves line 1 solid
    line.appendChild(sp); $("title").appendChild(line);
  });
  $("from").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.hex.toLowerCase() === st.from.toLowerCase()));
  for (const id of Object.keys(CHOICES)) $(id).querySelectorAll("button").forEach(b => { const on = b.dataset.v === String(st[id]); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  for (const id of ["start", "end", "size", "top", "track"]) $(id).value = st[id];
  $("l1").value = st.l1; $("l2").value = st.l2;
  $("v-start").textContent = st.start + "%"; $("v-end").textContent = st.end + "%"; $("v-size").textContent = st.size + "px";
  $("v-top").textContent = st.top + "px"; $("v-track").textContent = (st.track / 1000).toFixed(3) + "em";
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
  if (replay) play();
}
// The clean rise, one line after the other: 42px up, fading in over 820ms, 200ms apart.
const MOTION = { rise_px: 42, duration_ms: 820, easing: "cubic-bezier(.19,1,.22,1)", stagger_ms: 200 };
function play() {
  [...$("title").querySelectorAll("span")].forEach((sp, i) => sp.animate(
    [{ opacity: 0, transform: `translateY(${px(MOTION.rise_px)})` }, { opacity: .7, offset: .45 }, { opacity: 1, transform: "translateY(0)" }],
    { duration: MOTION.duration_ms, delay: 150 + i * MOTION.stagger_ms, easing: MOTION.easing, fill: "backwards" }));
}
$("replay").addEventListener("click", play);
$("reset").addEventListener("click", () => { st = { ...DEFAULTS }; apply(); });
$("lock").addEventListener("click", async () => {
  const { l1, l2, ...rest } = st;
  try {
    const r = await fetch("/api/lock/text_fade", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...rest, background_image: gradient(), sample: [l1, l2], frame_width: 1080, motion: MOTION }) });
    if (!r.ok) throw new Error(r.status);
    toast("Text locked. Claude will use it for faded titles.");
  } catch { toast("Couldn't save. Ask Claude to restart the page."); }
});
apply();
window.pageReady = true;
})();
</script>
</body>
</html>
