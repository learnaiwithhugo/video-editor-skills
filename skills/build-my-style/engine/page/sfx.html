<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sounds</title>
<link rel="stylesheet" href="style.css">
<style>
  .need-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .need-head h2 { margin: 0; font-size: 20px; }
  .need-meta { color: var(--muted); font-size: 14px; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .scard { display: flex; gap: 16px; border: 1px solid var(--line); border-radius: 18px; padding: 14px; background: #fff; }
  .scard[data-v="keep"] { border-color: var(--keep); box-shadow: 0 0 0 1px var(--keep); }
  .scard[data-v="drop"] { border-color: var(--drop); box-shadow: 0 0 0 1px var(--drop); opacity: .7; }
  .info { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; justify-content: center; }
  .row1 { display: flex; align-items: center; gap: 14px; }
  .play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 18px; }
  .play.on { background: var(--accent-deep); }
  .name { font-size: 17px; font-weight: 600; }
  .len { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pick { display: flex; gap: 6px; }
  .pick button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 0; font-size: 13px; font-weight: 600; color: var(--ink); }
  .pick button.on[data-v="keep"] { background: var(--keep); border-color: var(--keep); color: #fff; }
  .pick button.on[data-v="drop"] { background: var(--drop); border-color: var(--drop); color: #fff; }
  .tile { flex: none; width: 130px; aspect-ratio: 9 / 16; background: #000; border-radius: 14px; overflow: hidden; position: relative; cursor: pointer; }
  .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 36%; }
  .tile .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .tile .word { color: #fff; font-weight: 700; font-size: 28px; letter-spacing: -0.035em; font-family: var(--font); }
  .tile .panel2 { position: absolute; inset: 0; background: var(--accent); transform: translateY(-100%); }
  .tile .icons { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tile .icons img { width: 34px; height: 34px; opacity: 0; }
  .tile .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); margin: 6px auto; }
  .tile .dot.done { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>Sounds</h1><div class="top-right"><a class="back" href="/">← Style Studio</a><span class="count" id="count"></span><button class="submit" id="submit">Send picks</button></div></div></header>
<main id="main"></main>
<div class="toast" id="toast" hidden></div>
<script src="boot.js"></script>
<script>
// Each sound plays at the level it would sit at in an edit (mix_db), with its animation, so a quiet pick
// sounds quiet here too. The rule: barely noticeable. If you clearly hear it, it's too loud.
const NEEDS = {
  cut:   { title: "Hard cut / punch-in", demo: "cut",   anchor: 0 },
  rise:  { title: "Clean rise",          demo: "rise",  anchor: 0.12 },
  blur:  { title: "Blur rise",           demo: "blur",  anchor: 0.12 },
  shine: { title: "Shine",               demo: "shine", anchor: 0.6 },
  tick:  { title: "Ring and ticks",      demo: "ticks", anchor: 0, repeat: [0, 0.32, 0.64] },
  panel: { title: "Panel slide",         demo: "panel", anchor: 0.33 },
  icon:  { title: "App icons rising",    demo: "icons", anchor: 0.1, repeat: [0, 0.18, 0.36] },
  click: { title: "Mouse click / lines drawing on", demo: null },
  hero:  { title: "Hero word landing",   demo: "blur",  anchor: 0.2 },
};
const EXPO = "cubic-bezier(.19,1,.22,1)";
let ctx, list = [], picks = {};
const buffers = {};
const audio = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; };
const buffer = f => (buffers[f] ||= fetch("/sfx/" + encodeURIComponent(f)).then(r => r.arrayBuffer()).then(b => audio().decodeAudioData(b)));

function demoHTML(kind, icons) {
  if (kind === "cut" || kind === "panel") return `<video src="assets/face-loop.mp4" muted loop playsinline autoplay></video>${kind === "panel" ? '<div class="panel2"></div>' : ""}`;
  if (kind === "rise" || kind === "blur" || kind === "shine") return '<div class="center"><span class="word" style="opacity:0">Simple</span></div>';
  if (kind === "ticks") return '<div class="center"><div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  if (kind === "icons") return `<div class="icons">${icons.slice(0, 3).map(i => `<img src="${i.file}" alt="">`).join("")}</div>`;
  return "";
}
function runDemo(tile, kind, step) {
  const q = s => tile.querySelector(s);
  if (kind === "cut") { const v = q("video"); v.style.transform = "scale(1.15)"; setTimeout(() => { v.style.transform = ""; }, 900); }
  else if (kind === "rise") q(".word").animate([{ transform: "translateY(46px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 850, easing: EXPO, fill: "forwards" });
  else if (kind === "blur") q(".word").animate([{ transform: "translateY(34px)", opacity: 0, filter: "blur(18px)" }, { transform: "translateY(0)", opacity: 1, filter: "blur(0)" }], { duration: 500, easing: EXPO, fill: "forwards" });
  else if (kind === "shine") { const w = q(".word"); w.style.opacity = 1; w.animate([{ color: "#fff" }, { color: "var(--accent)" }, { color: "#fff" }], { duration: 1200 }); }
  else if (kind === "ticks") tile.querySelectorAll(".dot")[step].classList.add("done");
  else if (kind === "panel") q(".panel2").animate([{ transform: "translateY(-100%)" }, { transform: "translateY(0)" }], { duration: 650, easing: "cubic-bezier(.65,0,.35,1)", fill: "forwards" });
  else if (kind === "icons") { const im = tile.querySelectorAll(".icons img")[step]; if (im) im.animate([{ transform: "translateY(40px)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }], { duration: 850, easing: EXPO, fill: "forwards" }); }
}
function resetDemo(tile) {
  tile.getAnimations({ subtree: true }).forEach(a => a.cancel());
  tile.querySelectorAll(".dot").forEach(d => d.classList.remove("done"));
  const w = tile.querySelector(".word"); if (w) w.style.opacity = 0;
}
async function play(card, s) {
  const need = NEEDS[s.need] || {}, c = audio(), buf = await buffer(s.file);
  (card._t || []).forEach(clearTimeout); card._t = [];
  const steps = need.repeat || [0], point = s.hit_s ?? s.peak_s ?? 0, d = point - (need.anchor || 0);
  const animDelay = Math.max(d, 0), soundDelay = Math.max(-d, 0), t0 = c.currentTime + 0.06;
  steps.forEach(o => { const src = c.createBufferSource(), g = c.createGain(); src.buffer = buf; g.gain.value = Math.pow(10, (s.mix_db || 0) / 20); src.connect(g).connect(c.destination); src.start(t0 + soundDelay + o); });
  const tile = card.querySelector(".tile"), btn = card.querySelector(".play");
  if (tile) { resetDemo(tile); steps.forEach((o, i) => card._t.push(setTimeout(() => runDemo(tile, need.demo, i), (0.06 + (c.outputLatency || 0) + animDelay + o) * 1000))); card._t.push(setTimeout(() => resetDemo(tile), 3200)); }
  btn.classList.add("on"); card._t.push(setTimeout(() => btn.classList.remove("on"), (0.06 + soundDelay + steps[steps.length - 1] + (s.duration_s || 1)) * 1000));
}
function render(icons) {
  const main = document.getElementById("main");
  document.getElementById("count").textContent = `${list.length} sounds`;
  for (const [key, need] of Object.entries(NEEDS)) {
    const items = list.filter(s => s.need === key);
    if (!items.length) continue;
    const sec = document.createElement("section");
    sec.innerHTML = `<div class="need-head"><h2>${need.title}</h2></div><div class="sgrid"></div>`;
    for (const s of items) {
      const card = document.createElement("article");
      card.className = "scard";
      if (picks[s.file]) card.dataset.v = picks[s.file];
      card.innerHTML = (need.demo ? `<div class="tile">${demoHTML(need.demo, icons)}</div>` : "") +
        `<div class="info"><div class="row1"><button class="play" aria-label="Play">▶</button><div><div class="name"></div><div class="len"></div></div></div>
         <div class="pick"><button data-v="keep">Keep</button><button data-v="drop">Drop</button></div></div>`;
      card.querySelector(".name").textContent = s.name;
      card.querySelector(".len").textContent = `${(s.duration_s || 0).toFixed(2)}s · ${s.mix_db} dB`;
      card.querySelector(".play").addEventListener("click", () => play(card, s));
      const tile = card.querySelector(".tile"); if (tile) tile.addEventListener("click", () => play(card, s));
      const paint = () => card.querySelectorAll(".pick button").forEach(b => b.classList.toggle("on", b.dataset.v === picks[s.file]));
      card.querySelectorAll(".pick button").forEach(b => b.addEventListener("click", () => { picks[s.file] = picks[s.file] === b.dataset.v ? undefined : b.dataset.v; picks[s.file] ? card.dataset.v = picks[s.file] : delete card.dataset.v; paint(); try { localStorage.setItem("style-sfx", JSON.stringify(picks)); } catch {} }));
      paint();
      sec.querySelector(".sgrid").appendChild(card);
    }
    main.appendChild(sec);
  }
  if (!list.length) main.textContent = "No sounds yet.";
}
document.getElementById("submit").addEventListener("click", async () => {
  const payload = { kind: "sfx", round: "sfx", submitted_at: new Date().toISOString(), options: list.map(s => ({ id: s.file, need: s.need, label: s.name, verdict: picks[s.file] || null, note: "" })) };
  try { const r = await fetch("/api/review", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); if (!r.ok) throw 0; toast("Sent. Tell Claude \"done\"."); }
  catch { toast("Couldn't send. Ask Claude to restart the page."); }
});
(async () => {
  const { icons } = await window.boot;
  list = await getJSON("/sfx/sfx.json", []);
  try { picks = JSON.parse(localStorage.getItem("style-sfx")) || {}; } catch {}
  for (const s of list) if (s.picked && !picks[s.file]) picks[s.file] = "keep";
  render(icons);
  window.pageReady = true;
})();
</script>
</body>
</html>
