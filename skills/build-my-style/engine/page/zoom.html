<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Zoom Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .lab { grid-template-columns: auto minmax(0, 1fr); }
  .phonebox { position: relative; height: min(78vh, 820px); aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden; background: #000; }
  .phonebox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform-origin: 50% 32%; }
  .side { display: grid; gap: 18px; }
  .graphwrap { position: relative; width: 100%; max-width: 460px; aspect-ratio: 1; }
  #graph { width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
  .lab .controls { margin-top: 12px; }
  @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } .phonebox { height: auto; width: 100%; } }
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>Zoom Lab</h1><a class="back" href="/">← Style Studio</a></div></header>
<div class="lab">
  <div>
    <div class="phonebox"><video id="vid" src="assets/face-loop.mp4" muted loop autoplay playsinline></video></div>
    <div class="controls"><button class="pp" id="pp" aria-label="Play or pause"></button><input class="scrub" id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="time" id="time"></span></div>
  </div>
  <div class="side">
    <div class="panel">
      <div class="graphwrap"><canvas id="graph" width="920" height="920"></canvas></div>
      <div class="mono" id="bez"></div>
      <div class="presets" id="presets"></div>
    </div>
    <div class="panel">
      <div class="row"><label>Direction</label><div class="toggle" id="dirMode"><button data-v="out">Start zoomed, zoom out</button><button data-v="in">Zoom in</button></div></div>
      <div class="row"><label>Zoom amount <span id="v-amount"></span></label><input type="range" id="amount" min="102" max="160"></div>
      <div class="row"><label>Zoom time <span id="v-dur"></span></label><input type="range" id="dur" min="150" max="5000" step="10"></div>
      <div class="row" id="holdRow"><label>Hold zoomed <span id="v-hold"></span></label><input type="range" id="hold" min="0" max="3000" step="50"></div>
      <div class="row" id="outRow"><label>Zooming back out</label><div class="toggle" id="outMode"><button data-v="same">Same curve</button><button data-v="cut">Hard cut</button></div></div>
      <div class="lockbar"><button class="ghost" id="reset">Reset</button><button class="submit" id="lock">Lock this zoom</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="boot.js"></script>
<script>
(async () => {
const { brand, zoom: locked } = await window.boot;
const col = brand.colours, $ = id => document.getElementById(id);
const PRESETS = { "Smooth both ends": [0.65, 0, 0.35, 1], "Fast, then slow": [0.16, 1, 0.3, 1], "Slow, then fast": [0.55, 0, 0.9, 0.4], "Gentle": [0.4, 0, 0.2, 1], "Even": [0, 0, 1, 1] };
// Default = the long face zoom: cut in zoomed, glide out over 3.5 s, slow at both ends.
const DEFAULTS = { curve: [0.65, 0, 0.35, 1], amount: 120, dur: 3500, hold: 800, out: "same", dir: "out" };
const KEY = "style-zoom", LEAD = 500, TAIL = 700;
let st = { ...DEFAULTS, ...(locked || {}) };
try { st = { ...st, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
st.curve = [...st.curve];
let anims = [], paused = false, t = 0, start = performance.now();
const bezier = () => `cubic-bezier(${st.curve.map(n => +n.toFixed(2)).join(", ")})`;
const total = () => LEAD + st.dur + (st.dir === "in" ? st.hold + (st.out === "same" ? st.dur : 0) : 0) + TAIL;
const cv = $("graph"), g = cv.getContext("2d"), PAD = 120, SZ = 920 - PAD * 2;
const toPx = (x, y) => [PAD + x * SZ, PAD + (1 - y) * SZ], fromPx = (px, py) => [(px - PAD) / SZ, 1 - (py - PAD) / SZ];
const bz = (u, a, b) => { const v = 1 - u; return 3 * v * v * u * a + 3 * v * u * u * b + u * u * u; };
function draw(progress) {
  const [x1, y1, x2, y2] = st.curve;
  g.clearRect(0, 0, 920, 920); g.fillStyle = "#F6F7F9"; g.fillRect(PAD, PAD, SZ, SZ);
  g.strokeStyle = "#E4E8EE"; g.lineWidth = 2;
  for (let i = 1; i < 4; i++) { const p = PAD + i * SZ / 4; g.beginPath(); g.moveTo(p, PAD); g.lineTo(p, PAD + SZ); g.moveTo(PAD, p); g.lineTo(PAD + SZ, p); g.stroke(); }
  g.fillStyle = "#6B7280"; g.font = "600 26px sans-serif"; g.fillText("time →", PAD + SZ - 90, PAD + SZ + 44);
  g.save(); g.translate(PAD - 30, PAD + 150); g.rotate(-Math.PI / 2); g.fillText("zoom →", 0, 0); g.restore();
  const [ax, ay] = toPx(0, 0), [bx, by] = toPx(1, 1), [h1x, h1y] = toPx(x1, y1), [h2x, h2y] = toPx(x2, y2);
  g.strokeStyle = col.accent_soft; g.lineWidth = 4; g.beginPath(); g.moveTo(ax, ay); g.lineTo(h1x, h1y); g.moveTo(bx, by); g.lineTo(h2x, h2y); g.stroke();
  g.strokeStyle = col.ink; g.lineWidth = 8; g.lineCap = "round"; g.beginPath(); g.moveTo(ax, ay); g.bezierCurveTo(h1x, h1y, h2x, h2y, bx, by); g.stroke();
  for (const [x, y] of [[h1x, h1y], [h2x, h2y]]) { g.fillStyle = col.accent; g.beginPath(); g.arc(x, y, 22, 0, Math.PI * 2); g.fill(); g.strokeStyle = "#fff"; g.lineWidth = 6; g.stroke(); }
  for (const [x, y] of [[ax, ay], [bx, by]]) { g.fillStyle = col.ink; g.beginPath(); g.arc(x, y, 10, 0, Math.PI * 2); g.fill(); }
  if (progress != null) { let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; bz(m, x1, x2) < progress ? lo = m : hi = m; } const [dx, dy] = toPx(progress, bz(lo, y1, y2)); g.fillStyle = col.accent_deep; g.beginPath(); g.arc(dx, dy, 16, 0, Math.PI * 2); g.fill(); }
}
let dragging = null;
const hit = e => { const r = cv.getBoundingClientRect(), k = 920 / r.width; return [(e.clientX - r.left) * k, (e.clientY - r.top) * k]; };
cv.addEventListener("pointerdown", e => { const [px, py] = hit(e), [x1, y1, x2, y2] = st.curve, d = (x, y) => Math.hypot(px - toPx(x, y)[0], py - toPx(x, y)[1]); const d1 = d(x1, y1), d2 = d(x2, y2); if (Math.min(d1, d2) < 60) { dragging = d1 <= d2 ? 0 : 1; cv.setPointerCapture(e.pointerId); } });
cv.addEventListener("pointermove", e => { if (dragging == null) return; const [x, y] = fromPx(...hit(e)); st.curve[dragging * 2] = Math.min(1, Math.max(0, x)); st.curve[dragging * 2 + 1] = Math.min(1.6, Math.max(-0.6, y)); apply(); });
cv.addEventListener("pointerup", () => { dragging = null; });
$("presets").innerHTML = Object.keys(PRESETS).map(n => `<button data-n="${n}">${n}</button>`).join("");
$("presets").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st.curve = [...PRESETS[b.dataset.n]]; apply(); }));
for (const k of ["amount", "dur", "hold"]) $(k).addEventListener("input", e => { st[k] = +e.target.value; apply(); });
$("outMode").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st.out = b.dataset.v; apply(); }));
$("dirMode").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st.dir = b.dataset.v; apply(); }));
$("reset").addEventListener("click", () => { st = { ...DEFAULTS, curve: [...DEFAULTS.curve] }; apply(); });
function apply() {
  for (const k of ["amount", "dur", "hold"]) $(k).value = st[k];
  $("v-amount").textContent = st.amount + "%"; $("v-dur").textContent = (st.dur / 1000).toFixed(2) + "s"; $("v-hold").textContent = (st.hold / 1000).toFixed(2) + "s";
  $("bez").textContent = bezier();
  const match = Object.entries(PRESETS).find(([, cc]) => cc.every((n, i) => Math.abs(n - st.curve[i]) < .005));
  $("presets").querySelectorAll("button").forEach(b => b.classList.toggle("on", !!match && b.dataset.n === match[0]));
  $("outMode").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === st.out));
  $("dirMode").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === st.dir));
  $("outRow").style.display = $("holdRow").style.display = st.dir === "in" ? "" : "none";
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
  build(); paused ? setTime(t) : (start = performance.now() - t, anims.forEach(a => { a.currentTime = t; a.play(); }));
}
function build() {
  const v = $("vid"), z = st.amount / 100;
  anims.forEach(a => a.cancel());
  if (st.dir === "out") anims = [v.animate([{ transform: `scale(${z})` }, { transform: "scale(1)" }], { duration: st.dur, delay: LEAD, easing: bezier(), fill: "both" })];
  else {
    anims = [v.animate([{ transform: "scale(1)" }, { transform: `scale(${z})` }], { duration: st.dur, delay: LEAD, easing: bezier(), fill: "forwards" })];
    const outAt = LEAD + st.dur + st.hold;
    anims.push(v.animate([{ transform: `scale(${z})` }, { transform: "scale(1)" }], st.out === "same" ? { duration: st.dur, delay: outAt, easing: bezier(), fill: "forwards" } : { duration: 1, delay: outAt, fill: "forwards" }));
  }
  $("scrub").max = total();
}
function setTime(ms) { t = ms; anims.forEach(a => { a.pause(); a.currentTime = ms; }); }
$("pp").addEventListener("click", () => { if (paused) { paused = false; start = performance.now() - t; anims.forEach(a => a.play()); } else { paused = true; setTime(t); } });
$("scrub").addEventListener("input", e => { paused = true; setTime(+e.target.value); });
$("lock").addEventListener("click", async () => {
  try {
    const r = await fetch("/api/lock/zoom", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...st, easing: bezier() }) });
    if (!r.ok) throw new Error(r.status);
    toast("Zoom locked.");
  } catch { toast("Couldn't save. Ask Claude to restart the page."); }
});
(function frame(now) {
  if (!paused) { t = now - start; if (t >= total()) { start = now; t = 0; anims.forEach(a => { a.currentTime = 0; a.play(); }); } }
  $("pp").textContent = paused ? "▶" : "❚❚";
  if (document.activeElement !== $("scrub")) $("scrub").value = t;
  $("time").textContent = (t / 1000).toFixed(2) + "s";
  const p = (t - LEAD) / st.dur; draw(p >= 0 && p <= 1 ? p : null);
  requestAnimationFrame(frame);
})(performance.now());
apply();
window.pageReady = true;
})();
</script>
</body>
</html>
