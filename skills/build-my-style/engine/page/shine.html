<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Shine Lab</title>
<link rel="stylesheet" href="style.css">
<style>
  .lab { grid-template-columns: minmax(0, 1fr) 360px; }
  .stagebox { background: #000; border-radius: 16px; aspect-ratio: 16 / 10; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .word { font-weight: 700; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wordwrap { position: relative; }
  .glowlayer { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
  .panel { position: sticky; top: 84px; }
  .lab .controls { margin-top: 12px; }
  @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } .panel { position: static; } }
</style>
</head>
<body>
<header class="top"><div class="top-inner"><h1>Shine Lab</h1><a class="back" href="/">← Style Studio</a></div></header>
<div class="lab">
  <div>
    <div class="stagebox"><div class="wordwrap"><div class="word" id="word"></div><div class="word glowlayer" id="glowl" aria-hidden="true"></div></div></div>
    <div class="controls"><button class="pp" id="pp" aria-label="Play or pause"></button><input class="scrub" id="scrub" type="range" min="0" max="1000" step="1" value="0"><span class="time" id="time"></span></div>
  </div>
  <div class="panel">
    <div class="row"><label>Word</label><input type="text" id="text"></div>
    <div class="row"><label>Text size <span id="v-size"></span></label><input type="range" id="size" min="60" max="260"></div>
    <div class="row"><label>Shine width <span id="v-width"></span></label><input type="range" id="width" min="2" max="40"></div>
    <div class="row"><label>Shine strength <span id="v-strength"></span></label><input type="range" id="strength" min="0" max="100"></div>
    <div class="row"><label>Edge softness <span id="v-soft"></span></label><input type="range" id="soft" min="0" max="100"></div>
    <div class="row"><label>Glow on the shine <span id="v-glow"></span></label><input type="range" id="glow" min="0" max="60"></div>
    <div class="row"><label>Angle <span id="v-angle"></span></label><input type="range" id="angle" min="60" max="150"></div>
    <div class="row"><label>Sweep time <span id="v-dur"></span></label><input type="range" id="dur" min="300" max="3000" step="50"></div>
    <div class="row"><label>Pause between sweeps <span id="v-gap"></span></label><input type="range" id="gap" min="0" max="3000" step="50"></div>
    <div class="row"><label>Motion</label>
      <select id="ease">
        <option value="linear">Even</option>
        <option value="cubic-bezier(.45,0,.2,1)">Smooth in and out</option>
        <option value="cubic-bezier(.19,1,.22,1)">Fast start, long settle</option>
        <option value="cubic-bezier(.7,0,.84,0)">Slow start, fast finish</option>
        <option value="cubic-bezier(.65,0,.35,1)">Slow middle</option>
      </select>
    </div>
    <div class="row"><label>Shine colour</label><div class="swatches" id="shineColour"></div></div>
    <div class="row"><label>Text colour</label><div class="swatches" id="baseColour"></div></div>
    <div class="lockbar"><button class="ghost" id="reset">Reset</button><button class="submit" id="lock">Lock this shine</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="boot.js"></script>
<script>
// The shine is a gradient band clipped to the text, slid across by animating background-position.
// Its glow is a blurred copy of just the band moving in step, so the word itself never glows.
(async () => {
const { brand, shine: locked } = await window.boot;
const c = brand.colours, $ = id => document.getElementById(id);
const COLOURS = { White: "#FFFFFF", Accent: c.accent, "Accent soft": c.accent_soft, "Accent deep": c.accent_deep, "Warm white": "#FFF4D6" };
const BASES = { White: "#FFFFFF", Accent: c.accent, "Soft grey": "#C9CED6" };
const DEFAULTS = { text: (brand.lines && brand.lines.intro && brand.lines.intro[1]) || "edit", size: 190, width: 14, strength: 70, soft: 45, glow: 0, angle: 100, dur: 1400, gap: 900, ease: "cubic-bezier(.45,0,.2,1)", shine: "#FFFFFF", base: c.accent };
const KEY = "style-shine";
let st = { ...DEFAULTS, ...(locked ? { ...locked, text: locked.sample_word || DEFAULTS.text } : {}) };
try { st = { ...st, ...JSON.parse(localStorage.getItem(KEY)) }; } catch {}
let anims = [], paused = false, t = 0, start = performance.now();
const total = () => st.dur + st.gap;
function swatches(el, list, key) {
  el.innerHTML = Object.entries(list).map(([n, hex]) => `<button title="${n}" data-hex="${hex}" style="background:${hex}"></button>`).join("");
  const paint = () => el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.hex.toLowerCase() === String(st[key]).toLowerCase()));
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { st[key] = b.dataset.hex; apply(); }));
  return paint;
}
const paintShine = swatches($("shineColour"), COLOURS, "shine"), paintBase = swatches($("baseColour"), BASES, "base");
function apply() {
  const w = $("word"), g = $("glowl");
  w.textContent = g.textContent = st.text || " ";
  w.style.fontSize = g.style.fontSize = st.size + "px";
  const peak = `color-mix(in srgb, ${st.shine} ${st.strength}%, ${st.base})`, half = st.width / 2, edge = half * (st.soft / 100);
  const band = (b, p) => [`${b} 0%`, `${b} ${50 - half}%`, `${p} ${50 - half + edge}%`, `${p} ${50 + half - edge}%`, `${b} ${50 + half}%`, `${b} 100%`];
  w.style.backgroundImage = `linear-gradient(${st.angle}deg, ${band(st.base, peak).join(", ")})`;
  g.style.backgroundImage = `linear-gradient(${st.angle}deg, ${band("transparent", st.shine).join(", ")})`;
  w.style.backgroundSize = g.style.backgroundSize = "300% 100%";
  g.style.filter = `blur(${st.glow}px)`; g.style.opacity = st.glow ? st.strength / 100 : 0;
  for (const k of ["size", "width", "strength", "soft", "glow", "angle", "dur", "gap"]) $(k).value = st[k];
  $("text").value = st.text; $("ease").value = st.ease;
  $("v-size").textContent = st.size + "px"; $("v-width").textContent = st.width + "%"; $("v-strength").textContent = st.strength + "%";
  $("v-soft").textContent = st.soft + "%"; $("v-glow").textContent = st.glow ? st.glow + "px" : "off"; $("v-angle").textContent = st.angle + "°";
  $("v-dur").textContent = (st.dur / 1000).toFixed(2) + "s"; $("v-gap").textContent = (st.gap / 1000).toFixed(2) + "s";
  paintShine(); paintBase();
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
  build(); paused ? setTime(t) : (start = performance.now() - t, anims.forEach(a => { a.currentTime = Math.min(t, st.dur); a.play(); }));
}
function build() {
  anims.forEach(a => a.cancel());
  const h = 1.5 * st.width / 100, m = 0.12, keys = [{ backgroundPosition: `${((1.5 + h + m) / 2) * 100}% 0` }, { backgroundPosition: `${((0.5 - h - m) / 2) * 100}% 0` }];
  const o = { duration: st.dur, easing: st.ease, fill: "both" };
  anims = [$("word").animate(keys, o), $("glowl").animate(keys, o)];
  $("scrub").max = total();
}
function setTime(ms) { t = ms; anims.forEach(a => { a.pause(); a.currentTime = Math.min(ms, st.dur); }); }
$("pp").addEventListener("click", () => { if (paused) { paused = false; start = performance.now() - t; anims.forEach(a => a.play()); } else { paused = true; setTime(t); } });
$("scrub").addEventListener("input", e => { paused = true; setTime(+e.target.value); });
for (const k of ["size", "width", "strength", "soft", "glow", "angle", "dur", "gap"]) $(k).addEventListener("input", e => { st[k] = +e.target.value; apply(); });
$("text").addEventListener("input", e => { st.text = e.target.value; apply(); });
$("ease").addEventListener("change", e => { st.ease = e.target.value; apply(); });
$("reset").addEventListener("click", () => { st = { ...DEFAULTS }; apply(); });
$("lock").addEventListener("click", async () => {
  const { text, ...rest } = st;
  try {
    const r = await fetch("/api/lock/shine", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...rest, sample_word: text }) });
    if (!r.ok) throw new Error(r.status);
    toast("Shine locked.");
  } catch { toast("Couldn't save. Ask Claude to restart the page."); }
});
(function frame(now) {
  if (!paused) { t = now - start; if (t >= total()) { start = now; t = 0; anims.forEach(a => { a.currentTime = 0; a.play(); }); } }
  $("pp").textContent = paused ? "▶" : "❚❚";
  if (document.activeElement !== $("scrub")) $("scrub").value = t;
  $("time").textContent = (t / 1000).toFixed(2) + "s";
  requestAnimationFrame(frame);
})(performance.now());
apply();
window.pageReady = true;
})();
</script>
</body>
</html>
